name: XyCore
version: '0.3.10'
main: org.xyplugin.xycore.XyCorePlugin
api-version: '1.12'
author: XyPlugin
description: RPG server core services and extension API
softdepend: [Vault, PlaceholderAPI, MythicMobs, HolographicDisplays, AttributePlus, DragonCore, Multiverse-Core]

commands:
  xycore:
    description: XyCore administration command
    usage: /xycore <status|reload|modules|save|info|mms>
    aliases: [xy]

permissions:
  xycore.admin:
    description: Allows XyCore administration commands
    default: op
  xycore.worldprotect.bypass:
    description: Bypass XyCore WorldProtect restrictions
    default: op
