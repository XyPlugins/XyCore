# ============================================================
# OffhandLoreGuard 副手槽Lore保护模块
# 适用版本：Paper/Spigot 1.12.2
#
# 用途：
# 1. 原版45号槽位是副手槽，DragonCore 的 container_45 仍会走原版服务端背包逻辑。
# 2. 本模块在服务端层面拦截副手放入、F键交换和拖拽，防止墨魄等非副武器放入副手。
# 3. 判断只读取物品Lore，不依赖显示名。
# ============================================================

settings:
  # 是否发送拦截提示。
  send-message: true

  # 提示冷却，单位毫秒。防止客户端连续尝试放入时刷屏。
  message-cooldown-ms: 500

  # 是否使用 XyCore 主配置 messages.prefix。
  use-prefix: true

  # 提示前缀。{core_prefix} 会替换为 XyCore config.yml 的 messages.prefix。
  prefix: '{core_prefix}'

  # 拦截后是否在下一 tick 再检查一次副手。
  # DragonCore container_45 有时会先显示放入，本项可把已经进副手的非法物品退回背包，并同步客户端残影。
  delayed-cleanup: true

  # 触及副手槽后的客户端同步时间，单位 tick，20 tick = 1 秒。
  # 默认 1/3/6 tick 各同步一次，用于压短 DragonCore container_45 的残影时间。
  # 如果仍有残影，可以加 10；如果想更轻量，可以只保留 1 和 3。
  sync-repeat-ticks:
    - 1
    - 3
    - 6

  # 如果背包满，退回失败的非法副手物品是否掉落在玩家脚下。
  drop-overflow: true

match:
  # 副手允许的Lore。
  # 默认只允许带 “&7类型: &f副武器” 的物品。
  required-lore: '&7类型: &f副武器'

  # contains = 某一行Lore包含 required-lore 即可。
  # exact = 必须有一整行Lore与 required-lore 完全相同。
  mode: contains

  # 是否忽略空格。建议保持 true，兼容 “类型: 副武器” 与 “类型:副武器”。
  ignore-spaces: true

  # 是否忽略颜色代码。
  # false = 颜色也要匹配；true = 只匹配去色后的文字。
  ignore-colors: false

messages:
  denied: '&c副手槽只能放入带有 &f类型: 副武器 &c的物品。'
